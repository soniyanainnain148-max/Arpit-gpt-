<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Dark GPT — Coding AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#0b1020;--panel:#111830;--panel-2:#172042;--line:#243056;
  --text:#e8ecf8;--muted:#8e9ac0;--accent:#4d7cff;--accent-2:#7aa2ff;
  --danger:#ff6b7a;--code:#0a0f1e;--inline:#b9ccff;--radius:14px;
}
[data-theme="light"]{
  --bg:#f5f7ff;--panel:#ffffff;--panel-2:#e9eefc;--line:#d3daf0;
  --text:#141a33;--muted:#5d6890;--accent:#3563e9;--accent-2:#2a52c9;
  --danger:#d93a4c;--code:#0a0f1e;--inline:#2a52c9;
}
[data-theme="amoled"]{
  --bg:#000000;--panel:#08080d;--panel-2:#14151d;--line:#23242f;
  --text:#ececf3;--muted:#8a8c9f;--accent:#4d7cff;--accent-2:#7aa2ff;
  --danger:#ff6b7a;--code:#07080d;--inline:#b9ccff;
}
[data-theme="purple"]{
  --bg:#120b22;--panel:#1a1030;--panel-2:#261847;--line:#3a2766;
  --text:#efe8ff;--muted:#a595cc;--accent:#8b5cf6;--accent-2:#b39bff;
  --danger:#ff6b8a;--code:#0e0819;--inline:#d3c4ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Sora',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* Sidebar */
.sidebar{
  width:280px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:16px 12px;transition:transform .25s ease;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),#2a3fa8);font-weight:700;font-size:15px;
}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:1px}
.new-chat{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:11px;border-radius:12px;background:var(--accent);font-weight:600;font-size:14px;
  transition:filter .15s;
}
.new-chat:hover{filter:brightness(1.12)}
.chat-list{flex:1;overflow-y:auto;margin:14px 0;display:flex;flex-direction:column;gap:2px}
.chat-item{
  display:flex;align-items:center;gap:6px;padding:10px 10px;border-radius:10px;
  font-size:13.5px;color:var(--muted);cursor:pointer;
}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item:hover{background:var(--panel-2);color:var(--text)}
.chat-item.active{background:var(--panel-2);color:var(--text)}
.chat-item .del{opacity:0;padding:2px 6px;border-radius:6px;color:var(--muted)}
.chat-item:hover .del,.chat-item.active .del{opacity:1}
.chat-item .del:hover{color:var(--danger)}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.side-btn{padding:9px 10px;border-radius:10px;text-align:left;font-size:13.5px;color:var(--muted)}
.side-btn:hover{background:var(--panel-2);color:var(--text)}
.credit{font-size:12px;color:var(--muted);padding:4px 10px}
.credit b{color:var(--accent-2);font-weight:600}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:var(--bg);
}
.menu-btn{display:none;padding:6px 10px;border-radius:8px;font-size:18px}
.menu-btn:hover{background:var(--panel-2)}
.topbar h1{font-size:15px;font-weight:600}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--panel-2);color:var(--accent-2);border:1px solid var(--line)}
.messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:820px;margin:0 auto;padding:24px 18px 8px}

/* Welcome */
.welcome{max-width:720px;margin:0 auto;padding:9vh 20px 20px;text-align:center}
.welcome .logo{width:60px;height:60px;border-radius:18px;font-size:26px;margin:0 auto 20px}
.welcome h2{font-size:30px;font-weight:700;letter-spacing:-.4px}
.welcome p{color:var(--muted);margin-top:10px;font-size:15px;line-height:1.6}
.suggest{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:30px;text-align:left}
.suggest button{
  padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  font-size:13.5px;line-height:1.45;color:var(--text);transition:border-color .15s,background .15s;
}
.suggest button:hover{border-color:var(--accent);background:var(--panel-2)}
.suggest em{display:block;font-style:normal;color:var(--accent-2);font-size:12px;margin-bottom:4px;font-weight:600}

/* Messages */
.msg{display:flex;gap:12px;margin-bottom:22px}
.avatar{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--panel-2);border:1px solid var(--line)
}
.msg.bot .avatar{background:linear-gradient(140deg,var(--accent),#2a3fa8);border:none}
.bubble{min-width:0;flex:1;line-height:1.7;font-size:15px}
.msg.user .bubble{
  flex:initial;max-width:85%;margin-left:auto;background:var(--panel-2);
  padding:11px 15px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-break:break-word
}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{display:none}
.md p{margin:0 0 12px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 12px 22px}
.md li{margin:4px 0}
.md h1,.md h2,.md h3{margin:18px 0 8px;line-height:1.3}
.md h1{font-size:20px}.md h2{font-size:17.5px}.md h3{font-size:16px}
.md a{color:var(--accent-2)}
.md blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted);margin:0 0 12px}
.md table{border-collapse:collapse;margin-bottom:12px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 11px;font-size:14px}
.md th{background:var(--panel-2)}
.md :not(pre)>code{
  font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--panel-2);
  padding:2px 6px;border-radius:6px;color:var(--inline)
}
.codeblock{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code)}
.code-head{
  display:flex;justify-content:space-between;align-items:center;padding:7px 12px;
  background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:#8e9ac0
}
.copy{padding:3px 10px;border-radius:7px;font-size:12px;color:#8e9ac0}
.copy:hover{background:rgba(255,255,255,.1);color:#fff}
.codeblock pre{overflow-x:auto;padding:14px}
.codeblock code{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;background:none!important;padding:0!important}
.hljs{background:transparent!important}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{font-size:12px;color:var(--muted);padding:4px 9px;border-radius:7px}
.actions button:hover{background:var(--panel-2);color:var(--text)}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent-2);animation:blink 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.err{color:var(--danger);font-size:14px;line-height:1.6}

/* Composer */
.composer-wrap{padding:8px 18px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.composer{
  max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:10px;
  transition:border-color .15s;
}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{
  flex:1;background:none;border:none;outline:none;color:var(--text);font:inherit;font-size:15px;
  resize:none;max-height:200px;padding:7px 0;line-height:1.5
}
.composer textarea::placeholder{color:var(--muted)}
.send{
  width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;
  flex-shrink:0;font-size:17px;transition:filter .15s,opacity .15s
}
.send:hover{filter:brightness(1.12)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send.stop{background:var(--danger)}
.foot-note{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.foot-note b{color:var(--accent-2);font-weight:600}

.theme-btn{margin-left:auto;padding:6px 11px;border-radius:9px;font-size:16px;color:var(--muted)}
.theme-btn:hover{background:var(--panel-2);color:var(--text)}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:13px;
  border:1px solid var(--line);background:var(--bg);color:var(--text)
}
.chip i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.chip.on{border-color:var(--accent);background:var(--panel-2)}
/* Settings modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,16,.7);display:none;place-items:center;z-index:50;padding:16px}
.overlay.open{display:grid}
.modal{
  width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:22px;max-height:90dvh;overflow-y:auto
}
.modal h3{font-size:18px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;color:var(--text);font:inherit;font-size:14px
}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{padding:9px 16px;border-radius:10px;font-size:14px}
.btn.ghost{background:var(--panel-2)}
.btn.primary{background:var(--accent);font-weight:600}

.scrim{display:none}
@media(max-width:820px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(3,6,16,.6);z-index:20}
  .menu-btn{display:block}
  .suggest{grid-template-columns:1fr}
  .welcome h2{font-size:24px}
  .welcome{padding-top:5vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">D</div>
    <div><b>Dark GPT</b><small>Coding AI</small></div>
  </div>
  <button class="new-chat" id="newChat">+ New chat</button>
  <div class="chat-list" id="chatList"></div>
  <div class="side-foot">
    <button class="side-btn" id="openSettings">Settings</button>
    <button class="side-btn" id="clearAll">Clear all chats</button>
    <div class="credit">Developed by <b>Aditya</b></div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <h1>Dark GPT</h1>
    <span class="pill">Coding Expert</span>
    <button class="theme-btn" id="themeBtn" aria-label="Change theme" title="Change theme">◐</button>
  </header>

  <div class="messages" id="messages">
    <div id="welcome" class="welcome">
      <div class="logo">D</div>
      <h2>What are we building?</h2>
      <p>Write, debug, refactor and explain code in any language. Paste an error or describe a feature and get working code.</p>
      <div class="suggest">
        <button data-p="Build a responsive landing page in a single HTML file with a dark theme and smooth animations."><em>Web</em>Single-file landing page with dark theme</button>
        <button data-p="Write a WhatsApp bot in Node.js using Baileys with a command handler and a .menu command."><em>Bots</em>WhatsApp bot with command handler</button>
        <button data-p="Explain this error and fix it: TypeError: Cannot read properties of undefined (reading 'map')"><em>Debug</em>Fix a JavaScript TypeError</button>
        <button data-p="Create a REST API in Python FastAPI with JWT auth, CRUD endpoints and SQLite."><em>Backend</em>FastAPI with JWT auth and SQLite</button>
      </div>
    </div>
    <div class="thread" id="thread"></div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Dark GPT…" autocomplete="off"></textarea>
      <button class="send" id="sendBtn" aria-label="Send">➤</button>
    </div>
    <div class="foot-note">Developed by <b>Aditya</b> · Dark GPT can make mistakes, so test important code.</div>
  </div>
</section>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
    <h3>Settings</h3>
    <div class="field"><label>Theme</label><div class="themes" id="themeChips"></div></div>
    <div class="field"><label for="sApi">API endpoint</label><input id="sApi" spellcheck="false"></div>
    <div class="field"><label for="sTemp">Temperature (0–1.5)</label><input id="sTemp" type="number" step="0.1" min="0" max="1.5"></div>
    <div class="field"><label for="sSys">System prompt</label><textarea id="sSys"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" id="sReset">Reset</button>
      <button class="btn ghost" id="sCancel">Cancel</button>
      <button class="btn primary" id="sSave">Save</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIG — edit here ============ */
const DEFAULTS = {
  endpoint: "/api/chat",
  temperature: 0.4,
  system: `You are Dark GPT, an elite coding assistant developed by Aditya.
Your specialty is software engineering: web (HTML/CSS/JS/React/Node), Python, bots, APIs, databases, DevOps and debugging.
Rules:
- Give complete, working, production-quality code, not fragments, unless the user asks for a snippet.
- Put all code in fenced blocks with the correct language tag.
- Briefly explain the approach first, then the code, then how to run or deploy it.
- When debugging, name the root cause, then show the fix.
- Prefer clean, minimal, well-structured solutions and modern best practices.
- Match the user's language. If they write in Hinglish, reply in Hinglish; keep code and comments in English.
- If asked who made you, say you are Dark GPT, developed by Aditya. Never mention any underlying model, provider or API name.`
};
/* ============================================ */

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

let settings = Object.assign({}, DEFAULTS, store.get('dgpt_settings', {}));
let chats = store.get('dgpt_chats', []);
let currentId = null;
let controller = null;
let busy = false;

marked.setOptions({ gfm:true, breaks:true });

/* ---------- rendering ---------- */
function renderMarkdown(text){
  const renderer = new marked.Renderer();
  renderer.code = function(arg, langArg){
    const code = typeof arg === 'object' ? arg.text : arg;
    const lang = (typeof arg === 'object' ? arg.lang : langArg) || '';
    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
    const html = hljs.highlight(code, { language }).value;
    return `<div class="codeblock"><div class="code-head"><span>${language}</span><button class="copy">Copy</button></div><pre><code class="hljs">${html}</code></pre></div>`;
  };
  return DOMPurify.sanitize(marked.parse(text, { renderer }), { ADD_ATTR:['class'] });
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function addMessage(role, content){
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const av = `<div class="avatar">${role === 'user' ? 'You' : 'D'}</div>`;
  const body = role === 'user' ? esc(content) : `<div class="md">${renderMarkdown(content)}</div>`;
  el.innerHTML = `${av}<div class="bubble">${body}</div>`;
  $('thread').appendChild(el);
  return el;
}
function addActions(msgEl, text){
  const bar = document.createElement('div');
  bar.className = 'actions';
  bar.innerHTML = `<button data-a="copy">Copy</button><button data-a="regen">Regenerate</button>`;
  bar.addEventListener('click', e => {
    const a = e.target.dataset.a;
    if(a === 'copy'){ navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; setTimeout(()=>e.target.textContent='Copy',1200) }
    if(a === 'regen'){ regenerate() }
  });
  msgEl.querySelector('.bubble').appendChild(bar);
}
function scrollDown(){ const m = $('messages'); m.scrollTop = m.scrollHeight }

$('thread').addEventListener('click', e => {
  if(e.target.classList.contains('copy')){
    const code = e.target.closest('.codeblock').querySelector('code').innerText;
    navigator.clipboard.writeText(code);
    e.target.textContent = 'Copied';
    setTimeout(()=>e.target.textContent='Copy',1200);
  }
});

/* ---------- chats ---------- */
function current(){ return chats.find(c => c.id === currentId) }
function save(){ store.set('dgpt_chats', chats) }

function renderList(){
  const list = $('chatList');
  list.innerHTML = '';
  chats.slice().reverse().forEach(c => {
    const d = document.createElement('div');
    d.className = 'chat-item' + (c.id === currentId ? ' active' : '');
    d.innerHTML = `<span>${esc(c.title)}</span><button class="del" aria-label="Delete chat">✕</button>`;
    d.addEventListener('click', e => {
      if(e.target.classList.contains('del')){ deleteChat(c.id); return }
      openChat(c.id); closeSidebar();
    });
    list.appendChild(d);
  });
}
function newChat(){
  if(busy) return;
  currentId = null;
  $('thread').innerHTML = '';
  $('welcome').style.display = '';
  renderList();
  $('input').focus();
}
function openChat(id){
  if(busy) return;
  currentId = id;
  $('thread').innerHTML = '';
  $('welcome').style.display = 'none';
  current().messages.forEach(m => addMessage(m.role, m.content));
  renderList(); scrollDown();
}
function deleteChat(id){
  chats = chats.filter(c => c.id !== id);
  save();
  if(currentId === id) newChat(); else renderList();
}

/* ---------- API ---------- */
async function streamReply(chat){
  busy = true; setSendState(true);
  const botEl = addMessage('assistant', '');
  const bubble = botEl.querySelector('.md');
  bubble.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  scrollDown();

  controller = new AbortController();
  const payload = {
    temperature: Number(settings.temperature),
    stream: true,
    messages: [{ role:'system', content: settings.system }, ...chat.messages.map(m => ({role:m.role, content:m.content}))]
  };

  let full = '';
  try{
    const res = await fetch(settings.endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    if(!res.ok){
      throw new Error(`Request failed (${res.status}). Please try again in a moment.`);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let last = 0;
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith('data:')) continue;
        const data = s.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content || j.choices?.[0]?.message?.content || '';
          full += delta;
        }catch(e){}
      }
      const now = performance.now();
      if(now - last > 60){ bubble.innerHTML = renderMarkdown(full); scrollDown(); last = now }
    }
    if(!full) throw new Error('Empty response from the API.');
    bubble.innerHTML = renderMarkdown(full);
    chat.messages.push({ role:'assistant', content: full });
    save(); addActions(botEl, full);
  }catch(err){
    if(err.name === 'AbortError'){
      if(full){ bubble.innerHTML = renderMarkdown(full); chat.messages.push({role:'assistant', content: full}); save(); addActions(botEl, full) }
      else botEl.remove();
    }else{
      const hint = /Failed to fetch|NetworkError/i.test(err.message)
        ? ' Check your internet and that the /api/chat function is deployed.' : '';
      bubble.innerHTML = `<div class="err">${esc(err.message)}${hint}</div>`;
    }
  }finally{
    busy = false; controller = null; setSendState(false); scrollDown();
  }
}

function setSendState(streaming){
  const b = $('sendBtn');
  b.classList.toggle('stop', streaming);
  b.textContent = streaming ? '■' : '➤';
  b.setAttribute('aria-label', streaming ? 'Stop' : 'Send');
}

function send(text){
  text = (text ?? $('input').value).trim();
  if(!text || busy) return;
  if(!currentId){
    const c = { id: Date.now().toString(36), title: text.slice(0,42), messages: [] };
    chats.push(c); currentId = c.id;
  }
  $('welcome').style.display = 'none';
  const chat = current();
  chat.messages.push({ role:'user', content:text });
  save(); renderList();
  addMessage('user', text);
  $('input').value = ''; autoGrow();
  streamReply(chat);
}
function regenerate(){
  if(busy) return;
  const chat = current(); if(!chat) return;
  while(chat.messages.length && chat.messages[chat.messages.length-1].role === 'assistant') chat.messages.pop();
  save(); openChat(chat.id); streamReply(chat);
}

/* ---------- UI wiring ---------- */
function autoGrow(){ const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px' }
$('input').addEventListener('input', autoGrow);
$('input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)){ e.preventDefault(); send() }
});
$('sendBtn').addEventListener('click', () => busy ? controller?.abort() : send());
$('newChat').addEventListener('click', () => { newChat(); closeSidebar() });
document.querySelectorAll('.suggest button').forEach(b => b.addEventListener('click', () => send(b.dataset.p)));
$('clearAll').addEventListener('click', () => { if(confirm('Delete all chats?')){ chats = []; save(); newChat() } });

function closeSidebar(){ $('sidebar').classList.remove('open'); $('scrim').classList.remove('open') }
$('menuBtn').addEventListener('click', () => { $('sidebar').classList.add('open'); $('scrim').classList.add('open') });
$('scrim').addEventListener('click', closeSidebar);

function fillSettings(){
  $('sApi').value = settings.endpoint;
  $('sTemp').value = settings.temperature; $('sSys').value = settings.system;
}
$('openSettings').addEventListener('click', () => { fillSettings(); $('overlay').classList.add('open'); closeSidebar() });
$('sCancel').addEventListener('click', () => $('overlay').classList.remove('open'));
$('overlay').addEventListener('click', e => { if(e.target === $('overlay')) $('overlay').classList.remove('open') });
$('sReset').addEventListener('click', () => { settings = Object.assign({}, DEFAULTS); store.set('dgpt_settings', {}); fillSettings() });
$('sSave').addEventListener('click', () => {
  settings = { endpoint:$('sApi').value.trim(), temperature:$('sTemp').value, system:$('sSys').value };
  store.set('dgpt_settings', settings);
  $('overlay').classList.remove('open');
});

const THEMES = {
  dark:  {name:'Dark',   color:'#0b1020', meta:'#0b1020'},
  light: {name:'Light',  color:'#f5f7ff', meta:'#f5f7ff'},
  amoled:{name:'Black',  color:'#000000', meta:'#000000'},
  purple:{name:'Purple', color:'#8b5cf6', meta:'#120b22'}
};
let theme = store.get('dgpt_theme', 'dark');
if(!THEMES[theme]) theme = 'dark';
function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', THEMES[t].meta);
  store.set('dgpt_theme', t);
  document.querySelectorAll('#themeChips .chip').forEach(c => c.classList.toggle('on', c.dataset.t === t));
}
const chips = $('themeChips');
Object.keys(THEMES).forEach(k => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.t = k;
  b.innerHTML = `<i style="background:${THEMES[k].color}"></i>${THEMES[k].name}`;
  b.addEventListener('click', () => applyTheme(k));
  chips.appendChild(b);
});
$('themeBtn').addEventListener('click', () => {
  const keys = Object.keys(THEMES);
  applyTheme(keys[(keys.indexOf(theme) + 1) % keys.length]);
});
applyTheme(theme);

renderList();
</script>
</body>
</html>
